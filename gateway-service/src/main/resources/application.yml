server:
  port: 8080
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}

spring:
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: gateway-service

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cloud:
    gateway:
      routes:
        - id: event-service
          uri: "${EVENT_SERVICE_URL:http://localhost:8081}"
          predicates:
            - Path=/api/events/**

        - id: ai-service
          uri: "${AI_SERVICE_URL:http://localhost:8086}"
          predicates:
            - Path=/api/ai/**

        - id: booking-service
          uri: "${BOOKING_SERVICE_URL:http://localhost:8082}"
          predicates:
            - Path=/api/bookings/**

        - id: payment-service
          uri: "${PAYMENT_SERVICE_URL:http://localhost:8083}"
          predicates:
            - Path=/api/payments/**

        - id: user-service
          uri: "${USER_SERVICE_URL:http://localhost:8084}"
          predicates:
            - Path=/api/users/**

        - id: analytics-service
          uri: "${ANALYTICS_SERVICE_URL:http://localhost:8085}"
          predicates:
            - Path=/api/analytics/**

        - id: legacy-ping
          uri: "${EVENT_SERVICE_URL:http://localhost:8081}"
          predicates:
            - Path=/ping

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: ${CORS_ALLOWED_ORIGINS:*}
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            maxAge: 3600

app:
  jwt:
    secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: "health,info"